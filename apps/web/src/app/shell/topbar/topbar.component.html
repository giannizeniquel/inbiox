
    <header class="topbar">
      <!-- Left side -->
      <div class="topbar__left">
        <button
          class="topbar__hamburger"
          (click)="menuToggle.emit()"
          aria-label="Abrir menú"
          [class.is-hidden]="!isMobile()"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="topbar__brand">
          <!-- Logo SVG -->
          <svg class="topbar__logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="6" fill="currentColor" opacity="0.15"/>
            <path d="M7 8h10M7 12h7M7 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="topbar__app-name">Inbiox</span>
        </div>
      </div>

  <!-- Right side icons -->
  <div class="topbar__right">
    <!-- User menu with dropdown -->
    <div class="topbar__user-menu" (click)="toggleDropdown()" (clickOutside)="closeDropdown()">
      <button class="topbar__user-btn" [attr.aria-expanded]="dropdownOpen()">
        <span class="topbar__user-name">{{ displayName() }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="topbar__chevron" [class.topbar__chevron--open]="dropdownOpen()">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      @if (dropdownOpen()) {
        <div class="topbar__dropdown">
          <button class="topbar__dropdown-item" (click)="onProfile()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Mi Perfil</span>
          </button>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      }
    </div>

    <button class="topbar__icon-btn topbar__icon-btn--notifications" aria-label="Notificaciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      @if (hasNotifications()) {
        <span class="topbar__badge" aria-label="Notificaciones pendientes"></span>
      }
    </button>
  </div>
    </header>
