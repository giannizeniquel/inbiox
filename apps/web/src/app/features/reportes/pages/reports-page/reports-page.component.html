<div class="reports-page">
  <header class="reports-page__header">
    <h1 class="reports-page__title">Informes</h1>

    <div class="reports-page__filters">
      <div class="time-filter-buttons">
        <button
          class="time-filter-btn"
          [class.time-filter-btn--active]="timeFilter() === 'today'"
          (click)="setTimeFilter('today')"
        >
          Hoy
        </button>
        <button
          class="time-filter-btn"
          [class.time-filter-btn--active]="timeFilter() === '7d'"
          (click)="setTimeFilter('7d')"
        >
          7 días
        </button>
        <button
          class="time-filter-btn"
          [class.time-filter-btn--active]="timeFilter() === '30d'"
          (click)="setTimeFilter('30d')"
        >
          30 días
        </button>
        <button
          class="time-filter-btn"
          [class.time-filter-btn--active]="timeFilter() === 'custom'"
          (click)="setTimeFilter('custom')"
        >
          Personalizado
        </button>
      </div>

      <!-- Team filter (single-select, composable with the time filter above) -->
      <app-team-filter (teamChange)="onTeamFilterChange($event)" />

      @if (timeFilter() === 'custom') {
        <div class="custom-date-picker">
          <input
            type="date"
            class="date-input"
            [value]="fromDate()"
            (change)="fromDate.set($any($event.target).value)"
          />
          <span class="date-separator">-</span>
          <input
            type="date"
            class="date-input"
            [value]="toDate()"
            (change)="toDate.set($any($event.target).value)"
          />
          <button class="apply-btn" (click)="applyCustomFilter()">Aplicar</button>
        </div>
      }

      @if (authStore.isAdmin() || authStore.isSupervisor()) {
        <button
          class="export-csv-btn"
          type="button"
          [disabled]="exporting()"
          (click)="exportCsv()"
        >
          {{ exporting() ? 'Exportando...' : 'Exportar CSV' }}
        </button>
      }
    </div>

    @if (exportError()) {
      <p class="reports-page__export-error">{{ exportError() }}</p>
    }
  </header>

  <!-- ═══ Group A: KPIs ═══ -->
  <section class="kpi-grid">
    <app-response-time-card
      [value]="frtValue()"
      [loading]="frtLoading()"
    />
    <app-resolution-time-card
      [value]="rtValue()"
      [loading]="rtLoading()"
    />
    <app-ticket-count-card
      [open]="openCount()"
      [closed]="closedCount()"
      [loading]="countsLoading()"
    />
    <app-volume-trend-card
      [data]="volumeData()"
      [loading]="volumeLoading()"
    />
    <app-response-delay-card
      [data]="responseDelayData()"
      [loading]="responseDelayLoading()"
    />
  </section>

  <!-- ═══ Group B: Operational ═══ -->
  <section class="section-group">
    <h2 class="section-group__title">Operación en tiempo real</h2>
    <div class="section-group__grid">
      <app-agent-load-card
        [data]="agentLoadData()"
        [loading]="agentLoadLoading()"
      />
      <app-unassigned-card
        [data]="unassignedData()"
        [loading]="unassignedLoading()"
      />
      <app-available-agents-card
        [data]="availableAgentsData()"
        [loading]="availableAgentsLoading()"
      />
    </div>
  </section>

  <!-- ═══ FRT Trend: full width ═══ -->
  <section class="section-group">
    <h2 class="section-group__title">Tendencia de primera respuesta</h2>
    <app-frt-trend-card
      [data]="frtTrendData()"
      [loading]="frtTrendLoading()"
    />
  </section>

  <!-- ═══ Heatmap: full width ═══ -->
  <section class="section-group">
    <h2 class="section-group__title">Detalle y patrones</h2>
    <app-heatmap-card
      [data]="heatmapData()"
      [loading]="heatmapLoading()"
    />
  </section>

  <section class="section-group">
    <div class="section-group__grid">
      <app-recurring-card
        [data]="recurringData()"
        [loading]="recurringLoading()"
      />
      <app-reopened-card
        [data]="reopenedData()"
        [loading]="reopenedLoading()"
      />
    </div>
  </section>

  <!-- ═══ Group A: Agents ═══ -->
  <section class="agents-section">
    <h2 class="agents-section__title">Rendimiento de agentes</h2>
    <app-agent-leaderboard
      [agents]="agentsData()"
      [loading]="agentsLoading()"
    />
  </section>
</div>
