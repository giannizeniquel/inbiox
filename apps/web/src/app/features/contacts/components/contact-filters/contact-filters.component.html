<div class="contact-filters" role="group" aria-label="Filtros de contactos">
  <div class="filter-group">
    <span class="filter-label">Estado</span>
    <div class="filter-chips">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          class="filter-chip"
          [class.is-active]="currentStatus() === option.value"
          (click)="onStatusChange(option.value)"
          [attr.aria-pressed]="currentStatus() === option.value"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group">
    <span class="filter-label">Canal</span>
    <div class="filter-chips">
      @for (option of channelOptions; track option.value) {
        <button
          type="button"
          class="filter-chip"
          [class.is-active]="currentChannel() === option.value"
          (click)="onChannelChange(option.value)"
          [attr.aria-pressed]="currentChannel() === option.value"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>
</div>
