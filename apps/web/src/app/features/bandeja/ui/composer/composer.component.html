<div class="composer">
  @if (windowExpired()) {
    <!--
      WhatsApp 24h conversation-window compliance (Sprint 16 Fase 3):
      the customer has not written in over 24h, so Meta will reject any
      free-text send. The backend is authoritative and will reject with
      422 regardless; this is a proactive UX explanation only.
    -->
    <p class="warning" role="status">
      Han pasado más de 24 horas desde el último mensaje del cliente. No se pueden enviar mensajes de texto libre;
      esperá a que el cliente escriba de nuevo o usá una plantilla aprobada.
    </p>
  } @else {
  <!-- Emoji button — not implemented yet, disabled so it does not look active -->
  <button
    class="composer__icon-btn"
    type="button"
    disabled
    aria-label="Emoji (no disponible)"
    title="Emoji — no disponible todavía"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <line x1="9" y1="9" x2="9.01" y2="9"/>
      <line x1="15" y1="9" x2="15.01" y2="9"/>
    </svg>
  </button>

  <!-- Attachment button (hidden file input) -->
  <input
    #fileInput
    type="file"
    class="composer__file-input"
    accept=".pdf,.txt,.doc,.docx,.csv,.xlsx,.jpg,.jpeg,.png,.webp,.ogg,.mp3,.mp4"
    (change)="onFileSelected($event)"
    aria-label="Adjuntar archivo"
  />
  <button
    class="composer__icon-btn"
    type="button"
    aria-label="Adjuntar archivo"
    title="Adjuntar archivo"
    (click)="fileInput.click()"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
    </svg>
  </button>

  <!-- Selected file preview (click to open preview modal) -->
  @if (selectedFile()) {
    <div class="composer__file-preview">
      <button
        class="composer__file-preview-btn"
        type="button"
        title="Ver vista previa"
        (click)="openPreview()"
      >
        <span class="composer__file-name">{{ selectedFile()!.name }}</span>
      </button>
      <button
        class="composer__file-remove"
        type="button"
        aria-label="Quitar archivo"
        (click)="removeSelectedFile()"
      >
        &times;
      </button>
    </div>
  }

  <!-- Text input -->
  <textarea
    #inputEl
    class="composer__input"
    [(ngModel)]="text"
    [placeholder]="placeholder()"
    [attr.aria-label]="'Escribe un mensaje'"
    rows="1"
    (keydown.enter)="onKeyDown($any($event))"
    (input)="autoResize()"
  ></textarea>

  <!-- Voice button — not implemented yet, disabled so it does not look active -->
  <button
    class="composer__icon-btn composer__icon-btn--voice"
    type="button"
    disabled
    aria-label="Mensaje de voz (no disponible)"
    title="Mensaje de voz — no disponible todavía"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>

  <!-- Send button (visible when there's text or a file) -->
  @if (text().trim() || selectedFile()) {
    <button
      class="composer__send-btn"
      type="button"
      aria-label="Enviar mensaje"
      title="Enviar mensaje"
      (click)="send()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  }
  }

  <!-- Media preview modal -->
  <app-media-preview-modal
    [file]="selectedFile()"
    [visible]="showPreview()"
    (accept)="onPreviewAccept()"
    (cancel)="onPreviewCancel()"
  />
</div>
