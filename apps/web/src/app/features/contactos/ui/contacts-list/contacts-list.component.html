<div class="contacts-list" role="listbox" tabindex="0" aria-label="Lista de contactos">
  <!-- Loading state: show skeleton -->
  @if (store.loading()) {
    <app-contact-skeleton />
  }
  <!-- Error state: show error -->
  @else if (store.error()) {
    <app-contact-error [errorMessage]="store.error()!" (retry)="onRetry()" />
  }
  <!-- Empty state: no contacts at all -->
  @else if (store.filteredContacts().length === 0) {
    <app-contact-empty
      [variant]="emptyVariant()"
      (create)="onCreateContact()"
      (clear)="onClearSearch()"
    />
  }
  <!-- Data state: render contacts -->
  @else {
    <app-virtual-scroll-viewport
      appVirtualListCoordinator
      [items]="store.filteredContacts()"
      [idOf]="idOfContact"
      [infiniteScrollThreshold]="200"
      [itemHeight]="72"
      [bufferSize]="5"
      (itemActivated)="onContactSelect($event.id)"
      (loadMore)="onLoadMore()"
      style="padding-bottom: 40px;"
      #vps
    >
      @for (contact of coordinator().visibleItems(); track contact.id) {
        <app-contact-card
          [contact]="contact"
          [selected]="store.selectedContactId() === contact.id"
          (select)="onContactSelect($event)"
          [class.focused]="coordinator().isFocused(contact.id)"
          (mouseenter)="coordinator().onCardFocus($index)"
        />
      }
      @if (hasMore()) {
        <div class="load-more-sentinel">
          @if (loadingMore()) {
            <div class="load-more__indicator">
              <span class="load-more__spinner"></span>
              Cargando más...
            </div>
          }
        </div>
      }
    </app-virtual-scroll-viewport>
  }
</div>
