<div class="contacts-page">
  <div class="contacts-list-panel">
    <div class="contacts-header">
      <app-contacto-search
        [searchTerm]="screen.searchTerm()"
        (searchChange)="onSearchChange($event)"
      />
      <button type="button" class="btn-add" (click)="onAgregarContacto()">
        + Agregar Contacto
      </button>
      @if (authStore.isAdmin() || authStore.isSupervisor()) {
        <button type="button" class="btn-import" (click)="onImportarContactos()">
          Importar CSV
        </button>
      }
    </div>
    <app-filtros-de-contacto
      [filtros]="screen.filtros()"
      (filtroChange)="onFiltroChange($event)"
    />
    <app-contactos-list
      (select)="onSeleccionarContacto($event)"
      (reintentoSolicitado)="onReintentoSolicitado()"
      (cargarMas)="onCargarMas()"
      [hasMore]="store.paginacion().hasMore"
      [loadingMore]="loadingMore()"
    />
  </div>
  <div class="contacts-detail-panel" [class.visible]="screen.contactoSeleccionado() !== null">
    <app-detalle-de-contacto
      [contacto]="screen.contactoSeleccionado()"
      [loading]="store.loading()"
      (abrirConversacion)="onAbrirConversacion($event)"
      (openTicket)="onAbrirTicketDesdeLineaDeTiempo($event)"
      (editarContacto)="onEditarContacto($event)"
    />
  </div>
</div>

@if (showCreateDialog) {
  <app-contacto-create-dialog
    (close)="onCreateDialogClose($event)"
  />
}

@if (showEditDialog && contactoEnEdicion) {
  <app-contacto-edit-dialog
    [contacto]="contactoEnEdicion"
    (close)="onEditDialogClose($event)"
  />
}

@if (mostrarImportacionDialog) {
  <app-importacion-de-contactos-dialog
    (close)="onCerrarImportacionDialog($event)"
  />
}
