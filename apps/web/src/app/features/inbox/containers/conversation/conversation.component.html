<div class="conversation-container" #containerEl>
  @if (activeTicket()) {
    <!-- Sticky header: 64px — with back button for mobile -->
    <div class="conversation-container__header">
      <button
        class="conversation-container__back-btn"
        type="button"
        aria-label="Volver a la lista"
        (click)="onBack()"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <app-conversation-header
        [ticket]="activeTicket()!"
        (resolve)="onResolve()"
      />
    </div>

    <!-- Contextual warning banner (conditional) -->
    @if (warningMessage()) {
      <app-banner-warning>{{ warningMessage() }}</app-banner-warning>
    }

    <!-- Virtual-scroll message area — always rendered to avoid layout recalculation issues -->
    <app-conversation-loading [class.hidden]="!loading()" />
    <app-virtual-scroll-viewport
      #vps
      mode="variable"
      [items]="messages()"
      [estimatedItemHeight]="80"
      [bufferSize]="8"
      (scroll)="onScroll()"
      (visibleRange)="onVisibleRangeChange($event)"
      [class.hidden]="loading()"
      style="padding-bottom: 70px;"
    >
        @for (message of visibleMessages(); track message.id) {
          <app-message-bubble
            [message]="message"
            (retry)="onRetry($event)"
          />
        }
      </app-virtual-scroll-viewport>

    <!-- New messages indicator -->
    <app-new-messages-indicator
      [visible]="showNewMessagesIndicator()"
      (click)="scrollToBottom()"
    />

    <!-- Sticky composer: 56px -->
    <app-composer (sendMessage)="onSendMessage($event)" />
  } @else {
    <!-- No chat selected -->
    <app-conversation-empty />
  }
</div>
