<div
  class="ticket-list"
  role="listbox"
  tabindex="0"
  aria-label="Lista de tickets"
>
  <!-- Filters -->
  <app-ticket-filters (filterChange)="onFilterChange($event)" />

  <!-- Search -->
  <app-ticket-search (search)="onSearch($event)" />

  <!-- Ticket list -->
  @if (loading()) {
    <div class="loading">
      <span>Cargando tickets...</span>
    </div>
  } @else if (tickets().length === 0) {
    <div class="empty-state">
      <p>No hay tickets</p>
    </div>
  } @else {
    <app-virtual-scroll-viewport
      appVirtualListCoordinator
      [items]="tickets()"
      [idOf]="idOfTicket"
      [itemHeight]="64"
      [bufferSize]="5"
      (itemActivated)="selectTicket($event)"
      style="padding-bottom: 20px;"
      #vps
    >
      @for (ticket of coordinator().visibleItems(); track ticket.ticket_id) {
        <app-ticket-card
          [ticket]="ticket"
          [isActive]="selectedTicketId() === ticket.ticket_id"
          [class.focused]="coordinator().isFocused(ticket.ticket_id)"
          (select)="selectTicket(ticket)"
          (mouseenter)="coordinator().onCardFocus($index)"
        />
      }
    </app-virtual-scroll-viewport>
  }
</div>
