<div class="ticket-list">
  <!-- Filters -->
  <app-ticket-filters (filterChange)="onFilterChange($event)" />

  <!-- Search -->
  <app-ticket-search placeholder="Buscar tickets..." />

  <!-- Ticket list -->
  @if (loading()) {
    <div class="loading">
      <span>Cargando tickets...</span>
    </div>
  } @else if (tickets().length === 0) {
    <div class="empty-state">
      <p>No hay tickets</p>
    </div>
  } @else {
    <ul class="tickets">
      @for (ticket of tickets(); track trackByTicketId($index, ticket)) {
        <li>
          <app-ticket-card
            [ticket]="ticket"
            [isActive]="selectedTicketId() === ticket.ticket_id"
            (select)="selectTicket(ticket)"
          />
        </li>
      }
    </ul>
  }
</div>
