<div class="chat-skeleton">
  @for (item of skeletons; track $index) {
    <div class="skeleton-card">
      <div class="skeleton-card__avatar shimmer"></div>
      <div class="skeleton-card__lines">
        <div class="skeleton-card__line skeleton-card__line--short shimmer"></div>
        <div class="skeleton-card__line skeleton-card__line--long shimmer"></div>
      </div>
    </div>
  }
</div>
