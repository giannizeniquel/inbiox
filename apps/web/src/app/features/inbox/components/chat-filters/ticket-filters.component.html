<div class="ticket-filters" role="tablist" aria-label="Filtros de tickets">
  @for (tab of tabs; track tab.id) {
    <button
      class="ticket-filters__tab"
      type="button"
      role="tab"
      [attr.aria-selected]="activeTab() === tab.id"
      [ngClass]="{ 'is-active': activeTab() === tab.id }"
      (click)="selectTab(tab.id)"
    >
      {{ tab.label }}
      <span class="ticket-filters__badge">{{ counts()[tab.id] }}</span>
    </button>
  }
</div>
