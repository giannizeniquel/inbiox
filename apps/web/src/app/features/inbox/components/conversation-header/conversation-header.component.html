<header class="conversation-header">
  <!-- Left: avatar + name + assigned + connection -->
  <div class="conversation-header__left">
    <!-- Avatar 40px -->
    <div class="conversation-header__avatar">
      <span>{{ initials() }}</span>
    </div>

    <!-- Name + meta -->
    <div class="conversation-header__info">
      <div class="conversation-header__name-row">
        @if (contactId(); as cid) {
          <a
            class="conversation-header__name"
            [routerLink]="['/contacts', cid]"
            [attr.aria-label]="'Ver ficha de ' + contactName()"
          >{{ contactName() }}</a>
        } @else {
          <span class="conversation-header__name">{{ contactName() }}</span>
        }
      </div>

      <div class="conversation-header__meta">
        @if (ticket().owner) {
          <span class="conversation-header__assigned">
            Asignado: {{ ticket().owner!.name }}
          </span>
          <span class="conversation-header__dot">·</span>
        }

        <span class="conversation-header__fsm" [ngClass]="'status-' + ticket().status">
          {{ statusLabel() }}
        </span>

        <span class="conversation-header__dot">·</span>

        <span class="conversation-header__ticket-id">
          #{{ ticket().ticket_id }}
        </span>
      </div>
    </div>
  </div>

  <!-- Right: resolve button -->
  <button
    class="conversation-header__resolve-btn"
    type="button"
    [disabled]="resolving() || !canResolve()"
    [attr.aria-label]="'Resolver conversación con ' + contactName()"
    [attr.aria-busy]="resolving() ? 'true' : null"
    (click)="onResolve()"
  >
    {{ resolving() ? 'RESOLVIENDO…' : 'RESOLVER' }}
  </button>
</header>
