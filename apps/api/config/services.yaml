# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    MERCURE_JWT_TTL: 3600

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Compartido\Graph\GraphClient:
        arguments:
            $accessToken: '%env(META_ACCESS_TOKEN)%'
            $phoneNumberId: '%env(META_PHONE_NUMBER_ID)%'

    App\Conversacion\Controller\WebhookController:
        arguments:
            $verifyToken: '%env(META_WEBHOOK_VERIFY_TOKEN)%'
            $appSecret: '%env(META_APP_SECRET)%'

    App\Autenticacion\EventListener\RespuestaDeAutenticacionListener:
        arguments:
            $tokenTtl: '%lexik_jwt_authentication.token_ttl%'
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess, priority: -10 }

    Aws\S3\S3Client:
        factory: ['App\Compartido\Storage\S3ClientFactory', 'create']
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $accessKey: '%env(S3_KEY)%'
            $secretKey: '%env(S3_SECRET)%'

    media.public_s3_client:
        class: Aws\S3\S3Client
        factory: ['App\Compartido\Storage\S3ClientFactory', 'create']
        arguments:
            $endpoint: '%env(S3_PUBLIC_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $accessKey: '%env(S3_KEY)%'
            $secretKey: '%env(S3_SECRET)%'

    App\Compartido\Storage\AdjuntoStorageService:
        arguments:
            $s3Client: '@Aws\S3\S3Client'
            $publicS3Client: '@media.public_s3_client'
            $bucket: '%env(S3_BUCKET)%'
            $urlTtl: '%env(int:MEDIA_URL_TTL)%'

    App\Conversacion\PoliticaDeVentana:
        arguments:
            $safetyMarginMinutes: '%env(int:CONVERSATION_WINDOW_SAFETY_MARGIN_MINUTES)%'

    App\Conversacion\UseCase\VencimientoDeVentanaService:
        # Kept public: no other service injects this yet (only the Console
        # Command does), so Symfony's "remove unused private services" pass
        # would otherwise optimize it away entirely, including in tests.
        public: true
        arguments:
            $safetyMarginMinutes: '%env(int:CONVERSATION_WINDOW_SAFETY_MARGIN_MINUTES)%'
