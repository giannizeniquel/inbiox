security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SUPERVISOR, ROLE_AGENT]
        ROLE_SUPERVISOR: [ROLE_AGENT]

    password_hashers:
        App\Domain\User\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\User
                property: email

    firewalls:
        webhook:
            pattern: ^/webhook
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            refresh_jwt:
                check_path: /api/auth/refresh
            entry_point: jwt
            user_checker: App\Security\UserChecker

    access_control:
        - { path: ^/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
