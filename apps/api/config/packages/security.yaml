security:
    role_hierarchy:
        ROLE_ADMINISTRADOR: [ROLE_SUPERVISOR, ROLE_AGENTE]
        ROLE_SUPERVISOR: [ROLE_AGENTE]

    password_hashers:
        App\Administracion\Usuario: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Administracion\Usuario
                property: email

    firewalls:
        webhook:
            pattern: ^/webhook
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            refresh_jwt:
                check_path: /api/auth/refresh
            entry_point: jwt
            user_checker: App\Autenticacion\Security\VerificadorDeUsuario
            # Brute-force protection on POST /api/auth/login (json_login above).
            # Symfony's built-in login throttling: 5 attempts/minute per
            # username+IP, and 25 (5x) attempts/minute per IP overall, via
            # DefaultLoginRateLimiter (see LoginThrottlingListener). Backed by
            # the "cache.rate_limiter" pool (config/packages/rate_limiter.yaml).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        # Public endpoints (no auth required)
        - { path: ^/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }

        # Authenticated user required
        - { path: ^/api/auth/logout, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/mi/espacio-de-trabajo, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/mi/espacios-de-trabajo, roles: IS_AUTHENTICATED_FULLY }

        # Admin-only
        - { path: ^/admin/outbox, roles: ROLE_ADMINISTRADOR }

        # Admin API — User management
        - { path: ^/api/administracion/usuarios, roles: ROLE_ADMINISTRADOR }

        # Admin API — Workspace management (admin only)
        - { path: ^/api/administracion/espacios-de-trabajo, roles: ROLE_ADMINISTRADOR }

        # Admin API — Agent management (supervisor or higher)
        - { path: ^/api/administracion/agentes, roles: ROLE_SUPERVISOR }

        # Admin API — Team management (supervisor or higher, mirrors Agent CRUD access)
        - { path: ^/api/administracion/equipos, roles: ROLE_SUPERVISOR }

        # Debug routes — dev-only (DebugController gates by kernel.environment)
        - { path: ^/debug, roles: ROLE_ADMINISTRADOR }

        # Mercure token endpoint
        - { path: ^/api/mercure, roles: IS_AUTHENTICATED_FULLY }

        # Workspace agent listing (authenticated agents)
        - { path: ^/api/workspaces/\d+/available-agents, roles: ROLE_AGENTE }

        # Everything else requires at least ROLE_AGENTE
        - { path: ^/api, roles: ROLE_AGENTE }
