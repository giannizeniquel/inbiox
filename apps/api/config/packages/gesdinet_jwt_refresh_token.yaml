gesdinet_jwt_refresh_token:
    refresh_token_class: App\Domain\RefreshToken\RefreshToken
    ttl: 2592000
    token_parameter_name: inbiox_refresh
    single_use: true
    cookie:
        enabled: true
        same_site: lax
        path: /
        http_only: true
        # REFRESH_COOKIE_SECURE defaults to false so local dev (plain HTTP) keeps
        # working. MUST be set to true in production (served over HTTPS) so the
        # refresh token cookie is only ever sent over an encrypted connection.
        secure: '%env(bool:REFRESH_COOKIE_SECURE)%'
        remove_token_from_body: true
