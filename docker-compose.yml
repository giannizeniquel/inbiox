version: "3.9"

services:
  php:
    build:
      context: ./infra/docker/php
    container_name: inbiox_php
    extra_hosts:
      - "localhost:172.19.0.1"
    volumes:
      - ./apps/api:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: inbiox_nginx
    ports:
      - "8000:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: inbiox_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inbiox
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: inbiox_redis
    ports:
      - "6379:6379"

  mercure:
    image: dunglas/mercure
    container_name: inbiox_mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "40127d4eb35fc78be0315e2810d2f09f0cff9880f0a49fd5df0fc690e739ea9c"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:4200
        anonymous
    ports:
      - "3000:80"

  mailhog:
    image: mailhog/mailhog
    container_name: inbiox_mailhog
    ports:
      - "8025:8025"

  adminer:
    image: adminer
    container_name: inbiox_adminer
    ports:
      - "8080:8080"

  web:
    image: node:20-alpine
    container_name: inbiox_web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "4200:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx
      - mercure
    command: sh -c "npm install --quiet && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.docker.json --poll 2000"

  publisher:
    build:
      context: ./infra/docker/php
    container_name: inbiox_publisher
    volumes:
      - ./apps/api:/var/www/html
    command: sh -c "while true; do php bin/console app:outbox:publish --status=pending; sleep 2; done"
    depends_on:
      - php
      - mercure
    restart: always

volumes:
  db_data: