version: "3.9"

services:
  php:
    build:
      context: ./infra/docker/php
    container_name: inbiox_php
    extra_hosts:
      - "localhost:172.19.0.1"
    volumes:
      - ./apps/api:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
      - redis
      - minio

  nginx:
    image: nginx:alpine
    container_name: inbiox_nginx
    ports:
      - "8000:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: inbiox_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inbiox
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: inbiox_redis
    ports:
      - "6379:6379"

  mercure:
    image: dunglas/mercure
    container_name: inbiox_mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "40127d4eb35fc78be0315e2810d2f09f0cff9880f0a49fd5df0fc690e739ea9c"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:4200
        anonymous
    ports:
      - "3000:80"

  mailhog:
    image: mailhog/mailhog
    container_name: inbiox_mailhog
    ports:
      - "8025:8025"

  adminer:
    image: adminer
    container_name: inbiox_adminer
    ports:
      - "8080:8080"

  web:
    image: node:20-alpine
    container_name: inbiox_web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "4200:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx
      - mercure
    command: sh -c "npm install --quiet && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.docker.json --poll 2000"

  publisher:
    build:
      context: ./infra/docker/php
    container_name: inbiox_publisher
    volumes:
      - ./apps/api:/var/www/html
    command: sh -c "while true; do php bin/console app:outbox:publish; sleep 2; done"
    depends_on:
      - php
      - mercure
    restart: always

  # WhatsApp 24h conversation-window compliance (Sprint 16 Fase 3, design.md
  # Phase 6). Mirrors the `publisher` service's shape: no user-supplied
  # arguments, no untrusted value reaches the shell string. A non-zero exit
  # must not kill the loop — covered by restart: always plus the service's
  # own per-ticket \Throwable catch (ConversationWindowExpiryService).
  #
  # Gated behind a profile on purpose: unlike `publisher`, this service
  # actively closes real tickets on a recurring schedule. It must not start
  # as a side effect of a routine `docker compose up -d` / `make up` before
  # task 6.5's manual --dry-run gate has been run and reviewed. Start it
  # deliberately with `docker compose --profile window-closer up -d
  # window-closer` (or `COMPOSE_PROFILES=window-closer docker compose up -d`).
  # Once started, `restart: always` keeps it running across engine restarts,
  # same as any other long-running service — the profile only gates the
  # first, deliberate activation.
  window-closer:
    profiles:
      - window-closer
    build:
      context: ./infra/docker/php
    container_name: inbiox_window_closer
    volumes:
      - ./apps/api:/var/www/html
    command: sh -c "while true; do php bin/console app:conversation-window:close-expired; sleep 900; done"
    depends_on:
      - php
    restart: always

  minio:
    image: minio/minio:latest
    container_name: inbiox_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 app app-secret; do sleep 1; done;
      /usr/bin/mc mb -p local/inbiox-media;
      /usr/bin/mc anonymous set none local/inbiox-media;
      exit 0;
      "

volumes:
  db_data:
  minio_data: